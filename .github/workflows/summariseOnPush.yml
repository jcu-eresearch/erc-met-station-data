name: summariseOnPush
run-name: ${{ github.actor }} is summarising new data
on: [push]
jobs:
    summariseOnPush:
       runs-on: ubuntu-latest
       env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
          R_KEEP_PKG_SOURCE: yes
       steps:
          - uses: actions/checkout@v3
          - uses: r-lib/actions/setup-r@v2
            with:
              use-public-rspm: true
          - uses: r-lib/actions/setup-r-dependencies@v2
            with:
              extra-packages: any::dplyr, any::lubridate, any::openair
              needs: check

          - name: Run script
            run: |
              source("R/ERC_Met_Station_Data_Combine.R")
            shell: Rscript {0}

          - name: Commit files
            run: |
              git config --local user.email "actions@github.com"
              git config --local user.name "GitHub Actions"
              git add --all
              git commit -am "add data" || echo "Nothing to push"
              git push